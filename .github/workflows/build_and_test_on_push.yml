on: [ push, pull_request ]

name: build and test

jobs:
  rust_build_and_test:
    name: Rust Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          fetch-depth: 0  # full history + tags so `git describe` sets the --version string

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Run Rust unit tests
        if: "!matrix.cross"
        run: cargo test --verbose

      - name: Build Rust binary (native)
        if: "!matrix.cross"
        run: cargo build --release --verbose

      - name: Build Rust binary (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Run integration tests
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: |
          # Test with smallest HLA dataset
          mkdir -p /tmp/seqwish-test
          ./target/release/seqwish \
            -s test/HLA/V-352962.fa.gz \
            -p test/HLA/V-352962.paf.gz \
            -g /tmp/test.gfa \
            -b /tmp/seqwish-test \
            -t 4

          # Verify checksum
          EXPECTED=$(cat test/HLA/V-352962.fa.gz.gfa.md5)
          ACTUAL=$(md5sum /tmp/test.gfa | cut -f1 -d' ')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Checksum mismatch! Expected: $EXPECTED, Got: $ACTUAL"
            exit 1
          fi
          echo "✓ Integration test passed"

      - name: Upload binary artifact
        if: "!matrix.cross"
        uses: actions/upload-artifact@v4
        with:
          name: seqwish-${{ matrix.target }}
          path: target/release/seqwish

  format_and_lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings
