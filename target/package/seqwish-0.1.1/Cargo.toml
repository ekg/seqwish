[package]
edition = "2021"
rust-version = "1.70"
name = "seqwish"
version = "0.1.1"
authors = ["Erik Garrison <erik.garrison@gmail.com>"]
build = "build.rs"
exclude = [
    "test/*",
    "data/*",
    "cpp/*",
    "deps/*",
    "*.pdf",
    "*.md",
    "!README.md",
    ".github/*",
    ".claude/*",
    "Dockerfile",
    "SEQINDEX_ANALYSIS_FINAL_REPORT.txt",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A variation graph inducer - build pangenome graphs from pairwise alignments"
readme = "README.md"
keywords = [
    "bioinformatics",
    "genomics",
    "pangenome",
    "variation-graph",
    "gfa",
]
categories = [
    "science",
    "command-line-utilities",
]
license = "MIT"
repository = "https://github.com/pangenome/seqwish"

[lib]
