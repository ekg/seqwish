[package]
name = "seqwish_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
libc = "0.2"
once_cell = "1.21"
memmap2 = "0.9"
flate2 = "1.0"  # For gzip support
fm-index = "0.3"  # FM-index / CSA for sequence name lookup
vers-vecs = "1.1"  # Succinct bitvectors with rank/select
iitree-rs = { git = "https://github.com/pangenome/iitree-rs", rev = "41cb916636a30e96e35e58594b22bd4edc91be39" }  # Interval tree with disk-backed storage

# Transclosure dependencies
rayon = "1.11"                  # Parallel iteration & sorting
crossbeam-queue = "0.3"         # Lock-free queues
bitvec = { version = "1.0", features = ["atomic"] }  # Atomic bitvector
parking_lot = "0.12"            # Fast mutexes
sucds = "0.8"                   # Succinct data structures (rank/select)
uf_rush = "0.1"                 # Lock-free union-find

[build-dependencies]
cbindgen = "0.27"
